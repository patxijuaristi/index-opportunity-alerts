name: Index Opportunity Monitor

on:
  schedule:
    - cron: "0 20 * * *" # Daily at 20:00 UTC (after US market close)
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Required to commit updated state file

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push state changes
        if: always() # Run even if monitor step fails (partial state may have been saved)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update alert state [skip ci]"
            git push
          fi
